<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Hexagon / Shield -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" stroke="url(#primaryGrad)" stroke-width="2.5" fill="#090b14" filter="url(#glow)"/>
  <!-- Neural Circuit Rings -->
  <circle cx="32" cy="32" r="16" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.7"/>
  <!-- AI Adversary Eye / Aperture Core -->
  <polygon points="32,16 46,32 32,48 18,32" stroke="url(#primaryGrad)" stroke-width="2" fill="none"/>
  <!-- Core Pupil / Spark -->
  <circle cx="32" cy="32" r="6" fill="url(#coreGrad)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="2.5" fill="#ffffff"/>
  <!-- Top and Bottom Alignment Ticks -->
  <line x1="32" y1="8" x2="32" y2="14" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="32" y2="56" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="18" y2="32" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="32" x2="52" y2="32" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
</svg>
